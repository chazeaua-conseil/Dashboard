<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="css">
/* Layout : en-tête daté, bande de synthèse, puis deux colonnes (tâches | projets + notes) */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#16202a; --muted:#5a6876; --line:#d5dce3; --accent:#1f5d88;
  --accent-soft:#e1ecf5; --late:#b3412b; --warn:#9c6b0e; --ok:#2c7650; --low:#7a8794;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#17202a; --ink:#e3e9ef; --muted:#93a1ae; --line:#283542; --accent:#79b4dd;
    --accent-soft:#1c3346; --late:#e87d6c; --warn:#dcae52; --ok:#6cc398; --low:#7f8d9a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e3e9ef; --muted:#93a1ae; --line:#283542; --accent:#79b4dd;
  --accent-soft:#1c3346; --late:#e87d6c; --warn:#dcae52; --ok:#6cc398; --low:#7f8d9a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px;display:grid;gap:20px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(28px,4vw,40px)/1.1 var(--f-display);margin:6px 0 0;text-wrap:balance}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);text-decoration:none;font-weight:500;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.links a:hover{border-color:var(--accent)}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stat b{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.alert b{color:var(--late)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.banner div{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:grid;gap:20px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h2{font:600 22px/1.2 var(--f-display);margin:0}
.count{font:500 12px var(--f-mono);color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--late)}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{resize:vertical;width:100%;line-height:1.45}
.addform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addform .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.addform .opts label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px 9px 12px;border:1px solid var(--line);border-left:4px solid var(--low);border-radius:8px;background:var(--surface)}
.task.p-haute{border-left-color:var(--late)}
.task.p-normale{border-left-color:var(--accent)}
.task input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.task .txt{overflow-wrap:anywhere;display:block;cursor:pointer}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.task.done{border-left-color:var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;align-content:flex-start}
.chip{font:500 12px/1.6 var(--f-mono);padding:0 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.late{color:var(--late);border-color:currentColor}
.chip.today{color:var(--warn);border-color:currentColor}
.chip.proj{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:8px 2px;margin:0}

.proj{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj h3{font:600 16px/1.3 var(--f-body);margin:0;overflow-wrap:anywhere}
.status{cursor:pointer;font:500 12px/1.6 var(--f-mono);border-radius:999px;padding:0 9px;border:1px solid currentColor;background:transparent;white-space:nowrap}
.status.en-cours{color:var(--ok)}
.status.en-pause{color:var(--warn)}
.status.termine{color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.proj .next{font-size:14px;color:var(--muted)}
.proj .next b{color:var(--ink);font-weight:500}
.proj-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.edit-grid{display:grid;gap:8px}
.edit-grid label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--surface)}
.note.pinned{border-color:var(--accent);background:var(--accent-soft)}
.note .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.note-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note-foot time{font:12px var(--f-mono);color:var(--muted)}

.savebar{font:12px var(--f-mono);color:var(--muted)}
.savebar.pending{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.addform{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="state">{"v":1,"example":true,"projects":[{"id":"p1","name":"GOTAM · support GMAO","status":"en-cours","next":"Analyser la pile bgRFC bloquée","due":"2026-11-13"},{"id":"p2","name":"BySAV Lot 2 · cible Clean Core","status":"en-cours","next":"Finaliser la cartographie S/G/H/F/A","due":"2026-11-27"},{"id":"p3","name":"Session de formation","status":"en-pause","next":"Attendre la liste des stagiaires","due":""}],"tasks":[{"id":"t1","text":"Relancer le flux Kafka en recette et vérifier ZP_KAF_INBOUNDLOG","done":false,"due":"2026-11-06","prio":"haute","project":"p1"},{"id":"t2","text":"Préparer le chiffrage des incréments du POC","done":false,"due":"2026-11-05","prio":"haute","project":"p2"},{"id":"t3","text":"Relire la note de cadrage","done":false,"due":"2026-11-09","prio":"normale","project":"p2"},{"id":"t4","text":"Mettre à jour les participants dans ZTRN_CONFIG","done":false,"due":"2026-11-20","prio":"basse","project":"p3"},{"id":"t5","text":"Envoyer le compte rendu de la réunion de lundi","done":true,"due":"","prio":"normale","project":""}],"notes":[{"id":"n1","text":"Cette page enregistre chaque modification. Épingle-la dans la barre latérale de Claude pour l'ouvrir en un clic.","pinned":true,"updated":"2026-11-06T09:30:00"},{"id":"n2","text":"Points pour vendredi :\n- priorisation du Lot 2\n- disponibilités pour la formation","pinned":false,"updated":"2026-11-06T09:00:00"}]}</script>
<script id="appjs">
(function(){
  "use strict";
  var LS_KEY = "mon-accueil-state";
  var UI_KEY = "mon-accueil-ui";
  var STATUS = {"en-cours":"En cours","en-pause":"En pause","termine":"Terminé"};
  var STATUS_ORDER = ["en-cours","en-pause","termine"];
  var PRIO_RANK = {haute:0, normale:1, basse:2};

  var rawState = document.getElementById("state").textContent;
  var embedded = JSON.parse(rawState);
  var BASE = (function(s){ var h = 5381; for (var i=0;i<s.length;i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); })(rawState);
  var state = embedded;
  var artifact = null, mode = "init", saveTimer = null, dirty = false, toastTimer = null, editing = {proj:null, note:null};
  var ui = {filter:"todo"};
  try { var u = JSON.parse(localStorage.getItem(UI_KEY) || "null"); if (u) ui = Object.assign(ui, u); } catch(e){}

  /* ---------- utilitaires ---------- */
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function today(){ return iso(new Date()); }
  function addDays(s, n){ var d = new Date(s + "T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
  function fmtDay(s){ return new Date(s + "T12:00:00").toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"}); }
  function isoWeek(d){
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = new Date(Date.UTC(t.getUTCFullYear(),0,1));
    return Math.ceil(((t - y) / 86400000 + 1) / 7);
  }
  function dueInfo(due){
    if (!due) return null;
    var t = today();
    if (due < t) return {cls:"late", label:"En retard · " + fmtDay(due)};
    if (due === t) return {cls:"today", label:"Aujourd'hui"};
    if (due === addDays(t,1)) return {cls:"", label:"Demain"};
    return {cls:"", label:fmtDay(due)};
  }
  function projById(id){ for (var i=0;i<state.projects.length;i++) if (state.projects[i].id === id) return state.projects[i]; return null; }
  function $(sel, root){ return (root || document).querySelector(sel); }

  /* ---------- enregistrement ---------- */
  function buildDocument(){
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return "<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n" +
      "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n" +
      "<title>Mon accueil</title>\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
      "<link href=\"" + esc(document.querySelector("link[href*='css2']").getAttribute("href")) + "\" rel=\"stylesheet\">\n" +
      "<style id=\"css\">" + document.getElementById("css").textContent + "</style>\n</head>\n<body>\n<div id=\"app\"></div>\n" +
      "<script type=\"application/json\" id=\"state\">" + json + "<\/script>\n" +
      "<script id=\"appjs\">" + document.getElementById("appjs").textContent + "<\/script>\n</body>\n</html>\n";
  }
  function typingDraft(){
    var a = document.activeElement;
    return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type === "text")) && a.value.trim() !== "" && !a.hasAttribute("data-live");
  }
  function changed(){
    dirty = true;
    try { localStorage.setItem(LS_KEY, JSON.stringify({base:BASE, state:state})); } catch(e){}
    renderAll();
    scheduleSave(1200);
  }
  function scheduleSave(ms){
    clearTimeout(saveTimer);
    setSaveLabel();
    if (mode !== "artifact") return;
    saveTimer = setTimeout(flush, ms);
  }
  function flush(){
    if (!dirty || mode !== "artifact") return;
    if (typingDraft() || editing.proj || editing.note) { saveTimer = setTimeout(flush, 1500); return; }
    dirty = false; setSaveLabel("Enregistrement…");
    artifact.publish(buildDocument()).then(function(){
      try { localStorage.removeItem(LS_KEY); } catch(e){}
    }).catch(function(err){
      var code = err && (err.code || err.message || "");
      if (/conflict/i.test(code)) return; // la page se recharge sur la version gagnante
      if (/not_granted|not_writer/i.test(code)) { mode = "readonly"; setSaveLabel(); return; }
      dirty = true; setSaveLabel("Échec de l'enregistrement, nouvel essai…"); saveTimer = setTimeout(flush, 5000);
    });
  }
  function setSaveLabel(txt){
    var el = $("#savebar"); if (!el) return;
    if (!txt) {
      if (mode === "artifact") txt = dirty ? "Modifications en attente…" : "Tout est enregistré";
      else if (mode === "readonly") txt = "Lecture seule";
      else if (mode === "local") txt = "Enregistré dans ce navigateur uniquement";
      else txt = "Connexion…";
    }
    el.textContent = txt;
    el.className = "savebar" + (dirty ? " pending" : "");
  }

  /* ---------- squelette ---------- */
  function shell(){
    var now = new Date(), h = now.getHours();
    var greet = h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir";
    var dateStr = now.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    $("#app").innerHTML =
      '<div class="wrap">' +
        '<header class="top"><div><div class="eyebrow">' + esc(dateStr) + ' · semaine ' + isoWeek(now) + '</div>' +
          '<h1>' + greet + ', voici ta journée.</h1></div>' +
          '<nav class="links" aria-label="Raccourcis Claude">' +
            '<a href="https://claude.ai/new">Nouvelle conversation</a>' +
            '<a href="https://claude.ai/projects">Projets Claude</a>' +
            '<a href="https://claude.ai/code">Claude Code</a>' +
          '</nav></header>' +
        '<div id="banner"></div>' +
        '<div class="summary" id="summary"></div>' +
        '<div class="grid">' +
          '<section class="panel" aria-labelledby="h-tasks">' +
            '<div class="panel-head"><h2 id="h-tasks">Tâches</h2><span class="savebar" id="savebar" role="status"></span></div>' +
            '<form class="addform" id="task-form">' +
              '<label class="sr" for="task-text">Nouvelle tâche</label>' +
              '<input type="text" id="task-text" placeholder="Ajouter une tâche…" autocomplete="off">' +
              '<button class="btn primary" type="submit">Ajouter</button>' +
              '<div class="opts">' +
                '<label for="task-proj">Projet <select id="task-proj"></select></label>' +
                '<label for="task-due">Échéance <input type="date" id="task-due"></label>' +
                '<label for="task-prio">Priorité <select id="task-prio"><option value="haute">Haute</option><option value="normale" selected>Normale</option><option value="basse">Basse</option></select></label>' +
              '</div></form>' +
            '<div class="filters" id="filters" role="group" aria-label="Filtrer les tâches"></div>' +
            '<ul class="list" id="task-list"></ul>' +
            '<div class="row" id="task-tools"></div>' +
          '</section>' +
          '<div class="col">' +
            '<section class="panel" aria-labelledby="h-proj">' +
              '<div class="panel-head"><h2 id="h-proj">Projets en cours</h2><span class="count" id="proj-count"></span></div>' +
              '<div class="list" id="proj-list" style="display:grid;gap:10px"></div>' +
              '<form class="addform" id="proj-form"><label class="sr" for="proj-name">Nouveau projet</label>' +
                '<input type="text" id="proj-name" placeholder="Nouveau projet…" autocomplete="off">' +
                '<button class="btn" type="submit">Créer</button></form>' +
            '</section>' +
            '<section class="panel" aria-labelledby="h-notes">' +
              '<div class="panel-head"><h2 id="h-notes">Notes</h2><span class="count" id="note-count"></span></div>' +
              '<form id="note-form" style="display:grid;gap:8px"><label class="sr" for="note-text">Nouvelle note</label>' +
                '<textarea id="note-text" rows="3" placeholder="Une idée, un point à retenir… (Ctrl+Entrée pour ajouter)"></textarea>' +
                '<div class="row"><button class="btn primary" type="submit">Ajouter la note</button></div></form>' +
              '<ul class="list" id="note-list" style="gap:8px"></ul>' +
            '</section>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------- rendus ---------- */
  function renderBanner(){
    $("#banner").innerHTML = state.example ?
      '<div class="banner"><span>Ces tâches, projets et notes sont des <b>exemples</b>. Remplace-les par les tiens.</span>' +
      '<div><button class="btn" data-act="clear-examples">Tout effacer</button><button class="btn ghost" data-act="keep-examples">Garder et masquer ce message</button></div></div>' : "";
  }
  function renderSummary(){
    var t = today(), open = state.tasks.filter(function(x){ return !x.done; });
    var todayN = open.filter(function(x){ return x.due && x.due <= t; }).length;
    var late = open.filter(function(x){ return x.due && x.due < t; }).length;
    var active = state.projects.filter(function(p){ return p.status === "en-cours"; }).length;
    var doneWeek = state.tasks.filter(function(x){ return x.done && x.doneAt && x.doneAt >= addDays(t,-6); }).length;
    $("#summary").innerHTML =
      stat(open.length, "tâches à faire") +
      stat(todayN, "pour aujourd'hui") +
      stat(late, late > 1 ? "en retard" : "en retard", late > 0) +
      stat(active, active > 1 ? "projets actifs" : "projet actif");
    function stat(n, l, alert){ return '<div class="stat' + (alert ? " alert" : "") + '"><b>' + n + '</b><span>' + l + '</span></div>'; }
    void doneWeek;
  }
  function renderProjOptions(){
    var sel = $("#task-proj"), cur = sel.value;
    sel.innerHTML = '<option value="">Aucun</option>' + state.projects.filter(function(p){ return p.status !== "termine"; })
      .map(function(p){ return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join("");
    sel.value = projById(cur) ? cur : "";
  }
  function renderTasks(){
    var t = today();
    var F = [["todo","À faire"],["today","Aujourd'hui"],["done","Terminées"],["all","Toutes"]];
    $("#filters").innerHTML = F.map(function(f){ return '<button type="button" data-filter="' + f[0] + '" aria-pressed="' + (ui.filter === f[0]) + '">' + f[1] + '</button>'; }).join("");
    var list = state.tasks.filter(function(x){
      if (ui.filter === "todo") return !x.done;
      if (ui.filter === "today") return !x.done && x.due && x.due <= t;
      if (ui.filter === "done") return x.done;
      return true;
    }).sort(function(a,b){
      if (a.done !== b.done) return a.done ? 1 : -1;
      var da = a.due || "9999", db = b.due || "9999";
      if (da !== db) return da < db ? -1 : 1;
      return (PRIO_RANK[a.prio] || 1) - (PRIO_RANK[b.prio] || 1);
    });
    var empty = {todo:"Rien à faire. Profites-en ou ajoute une tâche ci-dessus.", today:"Rien de prévu pour aujourd'hui.", done:"Aucune tâche terminée pour l'instant.", all:"Aucune tâche."}[ui.filter];
    $("#task-list").innerHTML = list.length ? list.map(function(x){
      var d = !x.done && dueInfo(x.due), p = projById(x.project);
      return '<li class="task p-' + esc(x.prio || "normale") + (x.done ? " done" : "") + '">' +
        '<input type="checkbox" id="cb-' + esc(x.id) + '" data-toggle="' + esc(x.id) + '"' + (x.done ? " checked" : "") + ' aria-label="Marquer comme faite">' +
        '<div><label class="txt" for="cb-' + esc(x.id) + '">' + esc(x.text) + '</label>' +
          ((d || p || x.prio === "haute") ? '<div class="meta">' +
            (d ? '<span class="chip ' + d.cls + '">' + esc(d.label) + '</span>' : "") +
            (p ? '<span class="chip proj">' + esc(p.name) + '</span>' : "") +
            (x.prio === "haute" && !x.done ? '<span class="chip">Priorité haute</span>' : "") +
          '</div>' : "") +
        '</div>' +
        '<button class="btn ghost" data-del-task="' + esc(x.id) + '" aria-label="Supprimer la tâche">✕</button></li>';
    }).join("") : '<li class="empty">' + empty + '</li>';
    var doneN = state.tasks.filter(function(x){ return x.done; }).length;
    $("#task-tools").innerHTML = doneN ? '<button class="btn ghost" data-act="clear-done">Effacer les ' + doneN + ' tâche' + (doneN > 1 ? "s" : "") + ' terminée' + (doneN > 1 ? "s" : "") + '</button>' : "";
  }
  function renderProjects(){
    var order = function(p){ return STATUS_ORDER.indexOf(p.status); };
    var list = state.projects.slice().sort(function(a,b){ return order(a) - order(b); });
    $("#proj-count").textContent = state.projects.length + " projet" + (state.projects.length > 1 ? "s" : "");
    $("#proj-list").innerHTML = list.length ? list.map(function(p){
      if (editing.proj === p.id) return projEditor(p);
      var ts = state.tasks.filter(function(x){ return x.project === p.id; });
      var dn = ts.filter(function(x){ return x.done; }).length;
      var pct = ts.length ? Math.round(dn / ts.length * 100) : 0;
      var d = p.status !== "termine" && dueInfo(p.due);
      return '<article class="proj">' +
        '<div class="proj-top"><h3>' + esc(p.name) + '</h3>' +
          '<button class="status ' + esc(p.status) + '" data-cycle="' + esc(p.id) + '" title="Changer le statut">' + STATUS[p.status] + '</button></div>' +
        '<div class="bar" role="img" aria-label="' + pct + ' % des tâches faites"><i style="width:' + pct + '%"></i></div>' +
        (p.next ? '<div class="next">Prochaine étape : <b>' + esc(p.next) + '</b></div>' : "") +
        '<div class="proj-foot"><div class="meta" style="margin:0">' +
          '<span class="chip">' + dn + '/' + ts.length + ' tâche' + (ts.length > 1 ? "s" : "") + '</span>' +
          (d ? '<span class="chip ' + d.cls + '">' + esc(d.label.replace("En retard", "Échéance dépassée")) + '</span>' : "") +
        '</div><button class="btn ghost" data-edit-proj="' + esc(p.id) + '">Modifier</button></div>' +
      '</article>';
    }).join("") : '<p class="empty">Aucun projet. Crée le premier ci-dessous.</p>';
  }
  function projEditor(p){
    var id = esc(p.id);
    return '<form class="proj edit-grid" data-proj-form="' + id + '">' +
      '<label for="pe-name-' + id + '">Nom<input type="text" data-live id="pe-name-' + id + '" value="' + esc(p.name) + '"></label>' +
      '<label for="pe-next-' + id + '">Prochaine étape<input type="text" data-live id="pe-next-' + id + '" value="' + esc(p.next) + '"></label>' +
      '<label for="pe-status-' + id + '">Statut<select id="pe-status-' + id + '">' + STATUS_ORDER.map(function(s){ return '<option value="' + s + '"' + (p.status === s ? " selected" : "") + '>' + STATUS[s] + '</option>'; }).join("") + '</select></label>' +
      '<label for="pe-due-' + id + '">Échéance<input type="date" id="pe-due-' + id + '" value="' + esc(p.due) + '"></label>' +
      '<div class="row"><button type="button" class="btn ghost danger" data-del-proj="' + id + '">Supprimer</button>' +
      '<button type="button" class="btn" data-cancel-proj>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>';
  }
  function renderNotes(){
    var list = state.notes.slice().sort(function(a,b){
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return a.updated < b.updated ? 1 : -1;
    });
    $("#note-count").textContent = state.notes.length + " note" + (state.notes.length > 1 ? "s" : "");
    $("#note-list").innerHTML = list.length ? list.map(function(n){
      var id = esc(n.id);
      if (editing.note === n.id) return '<li class="note"><form data-note-form="' + id + '" style="display:grid;gap:8px">' +
        '<label class="sr" for="ne-' + id + '">Modifier la note</label><textarea data-live id="ne-' + id + '" rows="5">' + esc(n.text) + '</textarea>' +
        '<div class="row"><button type="button" class="btn" data-cancel-note>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form></li>';
      var when = new Date(n.updated).toLocaleString("fr-FR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
      return '<li class="note' + (n.pinned ? " pinned" : "") + '"><div class="body">' + esc(n.text) + '</div>' +
        '<div class="note-foot"><time datetime="' + esc(n.updated) + '">' + esc(when) + '</time><div class="row">' +
        '<button class="btn ghost" data-pin="' + id + '">' + (n.pinned ? "Désépingler" : "Épingler") + '</button>' +
        '<button class="btn ghost" data-edit-note="' + id + '">Modifier</button>' +
        '<button class="btn ghost danger" data-del-note="' + id + '">Supprimer</button></div></div></li>';
    }).join("") : '<li class="empty">Aucune note.</li>';
  }
  function renderAll(){ renderBanner(); renderSummary(); renderProjOptions(); renderTasks(); renderProjects(); renderNotes(); setSaveLabel(); }

  /* ---------- annulation ---------- */
  function toast(msg, undo){
    var old = $(".toast"); if (old) old.remove();
    clearTimeout(toastTimer);
    var el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status");
    el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">Annuler</button>' : "");
    document.body.appendChild(el);
    if (undo) el.querySelector("button").onclick = function(){ undo(); el.remove(); changed(); };
    toastTimer = setTimeout(function(){ el.remove(); }, 6000);
  }
  function snapshot(){ return JSON.parse(JSON.stringify(state)); }
  function withUndo(msg, fn){
    var before = snapshot(); fn(); changed();
    toast(msg, function(){ state = before; });
  }

  /* ---------- évènements ---------- */
  function bind(){
    $("#task-form").addEventListener("submit", function(e){
      e.preventDefault();
      var inp = $("#task-text"), txt = inp.value.trim(); if (!txt) return;
      state.tasks.push({id:uid("t"), text:txt, done:false, due:$("#task-due").value, prio:$("#task-prio").value, project:$("#task-proj").value});
      inp.value = ""; $("#task-due").value = ""; changed(); inp.focus();
    });
    $("#proj-form").addEventListener("submit", function(e){
      e.preventDefault();
      var inp = $("#proj-name"), txt = inp.value.trim(); if (!txt) return;
      var p = {id:uid("p"), name:txt, status:"en-cours", next:"", due:""};
      state.projects.push(p); inp.value = ""; editing.proj = p.id; changed();
    });
    $("#note-form").addEventListener("submit", function(e){
      e.preventDefault();
      var ta = $("#note-text"), txt = ta.value.trim(); if (!txt) return;
      state.notes.push({id:uid("n"), text:txt, pinned:false, updated:new Date().toISOString()});
      ta.value = ""; changed();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.tagName === "TEXTAREA") {
        e.preventDefault(); var f = e.target.form; if (f) f.requestSubmit();
      }
      if (e.key === "Escape" && (editing.proj || editing.note)) { editing.proj = editing.note = null; renderAll(); }
    });
    document.addEventListener("change", function(e){
      var id = e.target.getAttribute("data-toggle");
      if (!id) return;
      state.tasks.forEach(function(x){ if (x.id === id) { x.done = e.target.checked; x.doneAt = x.done ? today() : ""; } });
      changed();
    });
    document.addEventListener("submit", function(e){
      var pf = e.target.getAttribute("data-proj-form"), nf = e.target.getAttribute("data-note-form");
      if (pf) {
        e.preventDefault(); var p = projById(pf);
        var name = $("#pe-name-" + pf).value.trim();
        if (p) { p.name = name || p.name; p.next = $("#pe-next-" + pf).value.trim(); p.status = $("#pe-status-" + pf).value; p.due = $("#pe-due-" + pf).value; }
        editing.proj = null; changed();
      }
      if (nf) {
        e.preventDefault();
        var txt = $("#ne-" + nf).value.trim();
        state.notes.forEach(function(n){ if (n.id === nf && txt) { n.text = txt; n.updated = new Date().toISOString(); } });
        editing.note = null; changed();
      }
    });
    document.addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      var a;
      if ((a = b.getAttribute("data-filter"))) { ui.filter = a; try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch(err){} renderTasks(); return; }
      if ((a = b.getAttribute("data-del-task"))) { withUndo("Tâche supprimée.", function(){ state.tasks = state.tasks.filter(function(x){ return x.id !== a; }); }); return; }
      if ((a = b.getAttribute("data-cycle"))) { var p = projById(a); if (p) { p.status = STATUS_ORDER[(STATUS_ORDER.indexOf(p.status)+1) % 3]; changed(); } return; }
      if ((a = b.getAttribute("data-edit-proj"))) { editing.proj = a; renderProjects(); var f = $("#pe-name-" + a); if (f) f.focus(); return; }
      if (b.hasAttribute("data-cancel-proj")) { editing.proj = null; renderProjects(); scheduleSave(300); return; }
      if ((a = b.getAttribute("data-del-proj"))) { editing.proj = null; withUndo("Projet supprimé. Ses tâches sont conservées.", function(){
        state.projects = state.projects.filter(function(p){ return p.id !== a; });
        state.tasks.forEach(function(x){ if (x.project === a) x.project = ""; }); }); return; }
      if ((a = b.getAttribute("data-pin"))) { state.notes.forEach(function(n){ if (n.id === a) n.pinned = !n.pinned; }); changed(); return; }
      if ((a = b.getAttribute("data-edit-note"))) { editing.note = a; renderNotes(); var t = $("#ne-" + a); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } return; }
      if (b.hasAttribute("data-cancel-note")) { editing.note = null; renderNotes(); scheduleSave(300); return; }
      if ((a = b.getAttribute("data-del-note"))) { withUndo("Note supprimée.", function(){ state.notes = state.notes.filter(function(n){ return n.id !== a; }); }); return; }
      a = b.getAttribute("data-act");
      if (a === "clear-done") withUndo("Tâches terminées effacées.", function(){ state.tasks = state.tasks.filter(function(x){ return !x.done; }); });
      if (a === "clear-examples") withUndo("Exemples effacés.", function(){ state.tasks = []; state.projects = []; state.notes = []; state.example = false; });
      if (a === "keep-examples") { state.example = false; changed(); }
    });
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden" && dirty && mode === "artifact" && !typingDraft()) flush(); });
  }

  /* ---------- démarrage ---------- */
  shell(); bind(); renderAll();
  // Reprend une modification locale non encore publiée (onglet fermé trop tôt, par ex.)
  try {
    var pending = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (pending && pending.base === BASE && pending.state && pending.state.v === 1) { state = pending.state; dirty = true; renderAll(); }
    else localStorage.removeItem(LS_KEY);
  } catch(e){}

  var use = window.claude && window.claude.use;
  (use ? window.claude.use("artifact") : Promise.resolve(null)).then(function(ns){
    artifact = ns; mode = ns ? "artifact" : "local";
    setSaveLabel();
    if (ns && dirty) scheduleSave(1500);
  }).catch(function(){ mode = "local"; setSaveLabel(); });

  // Rafraîchit les libellés « Aujourd'hui / En retard » si la page reste ouverte après minuit
  var lastDay = today();
  setInterval(function(){ if (today() !== lastDay) { lastDay = today(); if (!dirty) location.reload(); else renderAll(); } }, 60000);
})();
</script>
</body>
</html>
